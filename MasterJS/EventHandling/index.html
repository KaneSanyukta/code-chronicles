<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventsInJS</title>
    <style>
        html,body{
            font-family: "Helvetica Now Display";
            background-color: #222;
            color:#ffff;
            padding: 0;
            margin: 0;
            overflow: hidden;
            position: relative;
            /* display: flex;
            align-items: center;
            justify-content: center; */
        }
        .boll{
            position: absolute;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) .3s;
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        .line{
            text-decoration: line-through;
        }
        li{
            cursor: pointer;
        }
        #a{
            background-color: chartreuse;
            width: 500;
            height: 500;
        }
        #b{
            background-color: rebeccapurple;
            width: 350;
            height: 350;
        }
        #c{
            background-color: orangered;
            width: 200;
            height: 200;
        }
        button{
            background-color: darkgreen;
            color: #ffff;
            padding: 12px 22px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- <div class="boll"></div> -->
    <h2>Bubbling working</h2>
    <div id="main">
        <div id="a">
            <div id="b">
                <div id="c">
                    <button>Click Me!</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
