<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventsInJS</title>
    <style>
        html,body{
            font-family: "Helvetica Now Display";
            background-color: #222;
            color:#ffff;
            padding: 0;
            margin: 0;
            /* overflow: hidden;
            position: relative; */
            /* display: flex;
            align-items: center;
            justify-content: center; */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #main{
            margin:3px;
        }
        input{
            direction: none;
            margin-bottom: 12px;
            width:300px;
            height: 7vh;
            padding: 3px 22px;
            font-size: .9rem;
            color: #ffff;
            font-weight: 400;
            background-color: #222;
            border: 3px solid #333;
            border-radius: 5px;
        }
        h3{
            font-weight: 300;
        }
        input[type="submit"]{
            border: none;
            width: 100px;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            background-color: rgb(25 134 193);
        }
        p{
            display:none;
            font-style: italic;
            color: red;
            margin: 3px;
            font-size: .9rem;
        }
        form{
            display: inline-flex;
            flex-direction: column;        
        }
        .btn{
            display: inline-flex;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <!-- <div class="boll"></div> -->
    <div id="main">
        <h1>Simple Form</h1>
        <form>
            <input type="text" name="" id="name" placeholder="Enter name" autocomplete="off">
            <p>Name must should contains atlist 3 letter.</p>
            <input type="text" name="" id="email" placeholder="Enter eamil" autocomplete="off">
            <p>Enter valid email(eg.'test@gmail.com').</p>
            <input type="password" name="" id="password" placeholder="Enter password" autocomplete="off">
            <input type="password" name="" id="confirm_password" placeholder="Confirm password" autocomplete="off">
            <p>Confirm password not matches to password.</p>
            <div class="btn">
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>
</body>
<script src="script.js"></script>
</html>
